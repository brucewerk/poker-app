name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Roda o Cypress na versão 22 e 24 do Node para garantir compatibilidade
        node-version: [22, 24]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # 🔥 O PASSO QUE CORRIGE O ERRO:
      # Remove o package-lock.json antigo e faz uma instalação limpa
      - name: Limpar cache e instalar dependências do zero
        run: |
          cd frontend
          rm -rf node_modules package-lock.json
          npm install

      - name: Rodar Cypress
        uses: cypress-io/github-action@v7
        with:
          working-directory: frontend
          build: npm run build
          start: npm run dev
          wait-on: "http://localhost:5173"
          wait-on-timeout: 120
          record: true
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
